<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Service Report & Anaesthesia Machine</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9edf3;font-family:Arial,Helvetica,sans-serif}
#menu{position:relative;z-index:100;background:#173b6c;color:#fff;padding:8px 10px;box-shadow:0 2px 8px #0003}
.app-tabs{display:flex;gap:8px;width:100%;align-items:stretch;justify-content:center}
.app-tabs button{flex:1 1 0;max-width:360px;border:0;border-radius:7px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;background:#fff;color:#173b6c}
.app-tabs button.active{background:#21a366;color:#fff}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:8px}
.action-bar button{border:0;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px;line-height:1.2;background:#fff;color:#173b6c}
.action-bar .primary{background:#21a366;color:#fff}.action-bar .print{background:#f5a623;color:#111}.action-bar .danger{background:#d64545;color:#fff}
.action-bar .mode{background:#fff;color:#173b6c}
.app{display:none;width:100%;min-height:calc(100vh - 100px);border:0}
.app.active{display:block}
@media(max-width:700px){
  #menu{padding:7px}
  .app-tabs{gap:5px}
  .app-tabs button{padding:10px 5px;font-size:12px}
  .action-bar{gap:6px;margin-top:6px}
  .action-bar button{flex:1 1 calc(50% - 6px);min-width:0;padding:9px 7px;font-size:12px}
}
@media print{
  #menu{display:none!important}
  body{background:#fff!important}
  .app{display:none!important;height:auto!important;min-height:0!important}
  .app.active{display:block!important}
}

/* KOMATIBILITAS LINTAS PERANGKAT */
html{width:100%;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{width:100%;min-width:0;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
button,input,select,textarea{font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;}
.app{display:none;width:100%;height:calc(100vh - 105px);height:calc(100dvh - 105px);min-height:420px;border:0;background:#e9edf3;}
.app.active{display:block;}
iframe.app{width:100%;max-width:100%;}
@media(max-width:700px){
  #menu{position:sticky;top:0;padding:6px; padding-top:max(6px, env(safe-area-inset-top));}
  .app-tabs{gap:4px;}
  .app-tabs button{min-height:42px;padding:9px 4px;font-size:11px;line-height:1.15;white-space:normal;}
  .action-bar{gap:5px;margin-top:5px;}
  .action-bar button{min-height:40px;padding:8px 6px;font-size:11px;}
  .app{height:calc(100vh - 155px);height:calc(100dvh - 155px);min-height:360px;}
}
@media(min-width:701px){
  .app{height:calc(100vh - 105px);height:calc(100dvh - 105px);}
}
@media(orientation:landscape) and (max-height:520px){
  .app{height:calc(100vh - 110px);height:calc(100dvh - 110px);min-height:300px;}
  .app-tabs button{padding:7px 5px;min-height:36px;}
  .action-bar button{padding:7px 8px;min-height:34px;}
}
</style>
</head>
<body>
<div id="menu">
  <div class="app-tabs">
    <button id="anaBtn" class="active" onclick="selectApp('anaesthesia')">1. Anaesthesia Machine</button>
    <button id="ventBtn" onclick="selectApp('ventilator')">2. Ventilator</button>
    <button id="fieldBtn" onclick="selectApp('field')">3. Field Service</button>
    <button id="beritaBtn" onclick="selectApp('berita')">4. Berita Acara</button>
  </div>
  <div class="action-bar">
    <button id="printBtn" class="print" onclick="callCurrent('print')">🖨️ Cetak / Simpan PDF F4</button>
    <button class="danger" onclick="callCurrent('reset')">Reset</button>
  </div>
</div>

<iframe id="anaApp" class="app active" title="Anaesthesia Machine"
 sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
<iframe id="fieldApp" class="app" title="Field Service Report"
 sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
<iframe id="beritaApp" class="app" title="Aplikasi Berita Acara"
 sandbox="allow-scripts allow-forms allow-modals allow-same-origin allow-downloads"></iframe>

function decodeHTML(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

const anaFrame=document.getElementById("anaApp");
const fieldFrame=document.getElementById("fieldApp");
const beritaFrame=document.getElementById("beritaApp");
anaFrame.srcdoc=decodeHTML(ANA_B64);
fieldFrame.srcdoc=decodeHTML(FIELD_B64);
beritaFrame.srcdoc=decodeHTML(BERITA_B64);

function hideInnerToolbar(frame){
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    const style=doc.createElement("style");
    style.textContent=".toolbar{display:none!important}";
    doc.head.appendChild(style);
  }catch(e){}
}
anaFrame.addEventListener("load",()=>hideInnerToolbar(anaFrame));
fieldFrame.addEventListener("load",()=>hideInnerToolbar(fieldFrame));

let currentApp="anaesthesia";
function selectApp(which){
  currentApp=which;
  const frames={anaesthesia:anaFrame,ventilator:anaFrame,field:fieldFrame,berita:beritaFrame};
  [anaFrame,fieldFrame,beritaFrame].forEach(frame=>frame.classList.remove("active"));
  (frames[which]||anaFrame).classList.add("active");
  document.getElementById("anaBtn").classList.toggle("active",which==="anaesthesia");
  document.getElementById("ventBtn").classList.toggle("active",which==="ventilator");
  document.getElementById("fieldBtn").classList.toggle("active",which==="field");
  document.getElementById("beritaBtn").classList.toggle("active",which==="berita");
  document.getElementById("printBtn").style.display = which==="berita" ? "none" : "";
  if(which==="anaesthesia") callApp("ana","showForm","anaesthesia");
  if(which==="ventilator") callApp("ana","showForm","ventilator");
}
function callApp(which,fn,...args){
  const frame=which==="ana"?anaFrame:fieldFrame;
  try{
    const w=frame.contentWindow;
    if(typeof w[fn]==="function") return w[fn](...args);
  }catch(e){console.error(e)}
}
function callCurrent(action){
  if(currentApp==="berita"){
    if(action==="print") return callApp("berita","printA4");
    if(action==="reset") return callApp("berita","clearRows");
    return;
  }
  if(currentApp==="field"){
    if(action==="save") return callApp("field","saveData");
    if(action==="load") return callApp("field","loadData");
    if(action==="reset") return callApp("field","clearForm");
    if(action==="print") return callPrint("field");
    return;
  }
  if(action==="save") return callApp("ana","saveData");
  if(action==="load") return callApp("ana","loadData");
  if(action==="reset") return callApp("ana","resetForm");
  if(action==="print") return callPrint("ana");
}
function callPrint(which){
  const frame=which==="ana"?anaFrame:fieldFrame;
  try{
    if(which==="field" && typeof frame.contentWindow.printF4==="function") return frame.contentWindow.printF4();
    return frame.contentWindow.print();
  }catch(e){console.error(e)}
}
selectApp("anaesthesia");

// Kompatibilitas browser: cegah halaman kosong bila iframe terlambat memuat.
function fitFrame(frame){
  try{
    const doc=frame.contentDocument;
    if(!doc || !doc.body) return;
    const h=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight,420);
    const viewport=window.innerHeight || document.documentElement.clientHeight || 700;
    frame.style.height=Math.max(h,viewport-105)+"px";
  }catch(e){}
}
[anaFrame,fieldFrame].forEach(frame=>{
  frame.addEventListener("load",()=>{
    hideInnerToolbar(frame);
    setTimeout(()=>fitFrame(frame),50);
    setTimeout(()=>fitFrame(frame),400);
  });
});
window.addEventListener("resize",()=>fitFrame(currentApp==="field"?fieldFrame:(currentApp==="berita"?beritaFrame:anaFrame)));
window.addEventListener("orientationchange",()=>setTimeout(()=>fitFrame(currentApp==="field"?fieldFrame:(currentApp==="berita"?beritaFrame:anaFrame)),250));
</script>
